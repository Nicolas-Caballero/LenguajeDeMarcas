<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulario</title>
</head>
<body>
    <h1>Formulario de alta de usuario</h1>
    <form action="http://172.30.18.224:3000/" method="post">
        <table>
            <tr>
                <td><label for="text">Identificador de nuevo usuario</label></td>
                <td><input type="text" title="usuario" name="usuario" value="usu_012345"></td>
            </tr>
            <tr>
                <td><label for="text">Nombre:</label></td>
                <td><input type="text" title="Nombre" name="nombre"></td>
                <td><label for="text">Apellidos:</label></td>
                <td><input type="text" title="Apellidos" name="apellidos"></td>
            </tr>
            <tr>
                <td><label for="text">Contraseña:</label></td>
                <td><input type="password" title="Contraseña" name="contrasena"></td>
                <td><label for="text">Repetir contraseña:</label></td>
                <td><input type="password" title="Repetir contraseña" name="repetir_contrasena"></td>
            </tr>
            <tr>
                <td><label for="text"> Email:</label></td>
                <td><input type="email" title="Email" name="email"></td>
            </tr>
            <tr>
                <td><label for="text">Sexo:</label></td>
                <td>
                    <input type="radio" title="Masculino" name="sexo" value="masculino">
                    <label for="text">Masculino</label>
                    <input type="radio" title="Femenino" name="sexo" value="femenino">
                    <label for="text">Femenino</label>
                </td>
            </tr>
             <tr>
                <td><label for="text">Aficiones:</label></td>
                <td>
                    <input type="checkbox" title="deportes" name="aficiones">
                    <label for="text">deportes</label>
                    <input type="checkbox" title="lectura" name="aficiones" >
                    <label for="text">lectura</label>
                    <input type="checkbox" title="cine" name="aficiones">
                    <label for="text">cine</label>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
